name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 语法与文档
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go 格式
        run: test -z "$(gofmt -l gateways/zgate)"

      - name: Go 构建与测试
        working-directory: gateways/zgate
        run: go build ./... && go test ./...

      - name: zgate 无窗产物校验（PE Subsystem 必须为 GUI）
        # 交叉编译一份 windows/amd64 出来，校验 PE 头的 Subsystem = 2（WINDOWS_GUI）。
        # 忘了 -H windowsgui 会退回 CONSOLE(3)，开机自启就弹 cmd 窗口。机制见 docs/PITFALLS.md §20。
        run: python3 gateways/zgate/build.py --cross-check

      - name: Python 语法
        run: python3 -c "import ast,glob; [ast.parse(open(f,encoding='utf-8').read(), f) for f in glob.glob('**/*.py', recursive=True)]"

      - name: JavaScript 语法
        run: find . -name '*.js' -not -path './third-party/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: 文档自检
        run: python3 tools/check-docs.py

      - name: 敏感信息扫描
        run: python3 tools/check-secrets.py
